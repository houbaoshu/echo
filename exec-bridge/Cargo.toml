[package]
name = "echo-exec"
version = "0.1.0"
edition = "2024"

# Process execution for the native Agent engine: one shell command per handle. No model,
# conversation, history or directory policy lives here; Swift owns all of that.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
mini-agent-exec = { path = "../../mini-agent-rs/exec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
rustix = { version = "1", features = ["process"] }
tempfile = "3"
